[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docugen-library"
version = "0.1.0"
description = "Production-grade, local-first document intelligence and generation framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "DocuGen Team", email = "maintainers@docugen.org" }
]
keywords = ["document", "generation", "pdf", "docx", "templates", "schema", "clauses", "contracts", "invoices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "pillow>=9.0.0",
    "cryptography>=41.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.2.0",
]
nlp = [
    "spacy>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "wheel",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
docugen = "docugen.cli.main:main"

[project.urls]
Homepage = "https://github.com/swayamprabhu2005/DocuGen"
Documentation = "https://github.com/swayamprabhu2005/DocuGen#readme"
Repository = "https://github.com/swayamprabhu2005/DocuGen.git"
Issues = "https://github.com/swayamprabhu2005/DocuGen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docugen = [
    "templates/builtins/**/*.json",
    "templates/builtins/**/*.j2",
    "templates/builtins/**/*.txt",
    "templates/builtins/**/*.docx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F841", "E402", "I001"]
